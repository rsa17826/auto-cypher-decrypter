<script src="/eel.js"></script>
<script src="./libloader.js"></script>
<script src="./allfuncs.js"></script>
<script src="./log.js"></script>
<script src="./indexeddb ls.js"></script>
<script src="./prog.js"></script>
<!-- <script src="./sds.js"></script> -->
<script src="./insane.bundle2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
<div id="cypherInputs"></div>
<span>message - optional</span>
<input type="text" name="" id="message" />
<br />
<button id="decrypt">decrypt</button>
<button id="clearOutput">clear output</button>
<div id="output"></div>
<div id="settings"></div>
<button id="loadFromFile">load from file</button>
<button
  onclick='a.download(JSON.stringify(ls.inputs), "cypher inputs.json")'
>
  save to file
</button>
<style>
  #cypherInputs {
    display: flex;
    flex-direction: row;
  }
  #cypherInputs > * {
    display: flex;
    flex-direction: column;
  }
</style>
<script>
  log = (...a) => {
    eel.log(...a)
    console.trace(...a)
  }
  onerror = log
  const a = loadlib("allfuncs")
  // const sds = loadlib("sds")
  const types = {
    bool: 0,
    string: 1,
    int: 2,
    float: 3,
  }

  const settingsFormat = {
    dontShowErrors: types.bool,
    updateOutputEveryDecryption: types.bool,
    exitOnPageClose: types.bool,
    hideDuplicateErrors: types.bool,
    filterRegex: types.input,
  }
  var settingsData = {}
  function updateSettingsUi(settingsData) {
    for (var k in settingsFormat) {
      a.qs("#settings").appendChild(
        ((type, k, saveData, val) => {
          switch (type) {
            case types.bool:
              return a.newelem("div", {}, [
                a.newelem("label", { for: k, innerHTML: k }),
                a.newelem("input", {
                  name: k,
                  type: "checkbox",
                  checked: val,
                  onclick: (e) => saveData(k, e.target.checked),
                }),
              ])
              return []
            case types.input:
              return a.newelem("div", {}, [
                a.newelem("label", { for: k, innerHTML: k }),
                a.newelem("input", {
                  name: k,
                  value: val,
                  oninput: (e) => saveData(k, e.target.value),
                }),
              ])
              return []
            default:
              error(type, k)
              return []
          }
        })(settingsFormat[k], k, saveData, settingsData[k])
      )
    }
  }
  function saveData(k, v) {
    log(k, v)
    eel.changeSetting(k, v)
  }
  function loadAllData() {
    a.qsa("#cypherInputs>div").forEach((e) => e.remove())
    for (var x of ls.inputs) {
      if (x.length) {
        var inp = addNewInputH(x[0])
        x.reverse()
        x.pop()
        x.reverse()
        var last
        if (x.length) {
          last = x.pop()
          for (var y of x) {
            var inp2 = addNewInputV(inp.parentElement, y)
          }
          if (last) {
            var inp2 = addNewInputV(inp.parentElement, last)
            addNewInputV(inp.parentElement)
          }
        } else {
          addNewInputV(inp.parentElement)
        }
      }
    }
    addNewInputH()
    ls.inputs = getAllData()
    a.qs("#message").value = ls.message ?? ""
  }
  a.listen("#loadFromFile", {
    async click(e) {
      ls.inputs = JSON.parse(
        await a.readfile(
          await (await a.getfiles(false, false, [".json"])).getFile()
        )
      )
      loadAllData()
    },
  })
  function getAllData() {
    return a
      .qsa("div>input:first-child", a.qs("#cypherInputs"))
      .map((e) =>
        a
          .qsa("input", e.parentElement)
          .map((e) => e.value)
          .filter((e) => e)
      )
  }
  a.listen("#message", {
    input() {
      ls.message = a.qs("#message").value
    },
  })
  ;(async () => {
    const ls = await loadlib("indexeddb ls")("cypher decrypter")
    globalThis.ls = ls
    ls.inputs ??= []
    await a.bodyload()
    loadAllData()
    await a.waituntil(() => eel._websocket)
    eel._websocket.onclose = window.close.bind(window)
    eel.expose(setProg)
    eel.expose(hideProg)
    eel.expose(showOutput)
    eel.expose(updateSettingsUi)
    eel.requestupdateSettingsUi()
  })()
  function showOutput(data, filename) {
    filename = "_" + filename.replace(/[^a-zA-Z0-9_-]/g, "_")
    if (a.qs("#output>#" + filename)) {
      a.qs("#output>#" + filename).innerHTML = insane(
        marked.parse(data)
      )
    } else {
      a.createelem(a.qs("#output"), "div", {
        id: filename,
        innerHTML: insane(marked.parse(data)),
      })
    }
  }
  function setProg(prog, maxProg, name) {
    if (!window.progBar) {
      window.progBar = new (loadlib("progress bar"))(prog, maxProg)
    }
    window.progBar.set(prog, name)
  }
  function hideProg() {
    if (window.progBar) window.progBar.remove()
    window.progBar = null
  }
  function addNewInputH(val = "") {
    var ss
    a.qs("#cypherInputs").appendChild(
      a.newelem(
        "div",
        {
          backgroundColor: "red",
        },
        [(ss = newinp(val))]
      )
    )
    return ss
  }
  function newinp(val = "") {
    return a.newelem("input", {
      type: "text",
      value: val,
      oninput(e) {
        ls.inputs = getAllData()
        if (
          a.qsa("div>input:first-child", a.qs("#cypherInputs"))[
            a.qsa("div>input:first-child", a.qs("#cypherInputs"))
              .length - 1
          ] == this
        ) {
          addNewInputH()
        }
        if (
          a.qsa("input", this.parentElement)[
            a.qsa("input", this.parentElement).length - 1
          ] == this
        ) {
          addNewInputV(this.parentElement)
        }
        if (
          this in
          a.qsa("div>input:first-child", a.qs("#cypherInputs"))
        ) {
          var list = a.qsa(
            "div>input:first-child",
            a.qs("#cypherInputs")
          )
          list.pop()
          for (var l of list) {
            if (!l.value) {
              l.remove()
              a.qsa(
                "div>input:first-child",
                a.qs("#cypherInputs")
              ).map(
                (e) =>
                  (e.idx = a
                    .qsa(
                      "div>input:first-child",
                      a.qs("#cypherInputs")
                    )
                    .indexOf(e))
              )
            }
          }
        } else {
          var list = a.qsa("input", this.parentElement)
          var found = false
          var tpe = this.parentElement
          for (var l of list) {
            if (!l.value) {
              a.qsa("input", tpe)
                .filter((e) => !e.value)
                .map((e) => e.remove())
              if (!a.qsa("input", tpe).length) {
                tpe.remove()
              }
              found = true
            }
          }
          if (found) {
            addNewInputV(tpe)
          }
        }
      },
    })
  }
  function addNewInputV(prev, val = "") {
    var ss
    prev.appendChild((ss = newinp(val)))
    return ss
  }
  a.listen("#decrypt", {
    click() {
      if (a.qs("#message").value) {
        eel.startDecoding(getAllData(), a.qs("#message").value)
      } else {
        eel.startDecoding(getAllData())
      }
    },
  })
  a.listen("#clearOutput", {
    click() {
      a.qsa("#output>*").forEach((e) => e.remove())
    },
  })
</script>
